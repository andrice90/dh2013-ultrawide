; Cabela's Dangerous Hunts 2013 (Steam demo) widescreen mod. Lives next to dh_2013_demo.exe with dinput8.dll.

[Display]
; 1 = the Options resolution list shows every mode the monitor offers (the game only lists widths up to
; 2560 and refresh rates 60/75/85/100/120/150/200). Widths above 4095 (DSR/VSR modes) stay hidden.
AllModes=1
; Modes with a lower refresh rate are hidden.
MinRefresh=50
; Force a resolution at startup, e.g. Width=3440 Height=1440. 0 = use the game's setting (pick it in Options).
Width=0
Height=0
; Refresh rate for the forced resolution. 0 = highest the monitor offers at that size.
Refresh=0

[Camera]
; 1 = the 3D view uses the real screen shape instead of 16:9 and gets wider to match (Hor+: same vertical
; view as 4:3, more on the sides). 0 = the game's behaviour (stretched on screens wider than 16:9).
FixAspect=1
; Field of view of the normal (unzoomed) view in degrees, measured on a 4:3 screen. 0 = game default (60).
; Wider screens add to it: at 3440x1440, 60 shows about 92 degrees horizontally, 70 about 103, 80 about 113.
FOV=0
; Zoom (relative to the normal view) at which scopes and binoculars get their original magnification back.
; Below it the extra FOV fades out. 1 = never widen zoomed views.
ZoomBlend=2.0
; Hotkeys as Windows virtual-key codes (106 = numpad *, 107 = numpad +, 109 = numpad -). 0 = off.
; Changes are saved to FOV= above.
KeyFOVUp=107
KeyFOVDown=109
KeyFOVReset=106
FOVStep=5

[Debug]
; Writes dh2013ws.log next to the game.
Log=1

[Proxy]
; Optional: another dinput8.dll to load instead of the system one (for chaining mods). Empty = system.
Chain=
